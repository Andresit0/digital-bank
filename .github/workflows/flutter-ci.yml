name: Flutter CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject committed Firebase/APNs secrets
        run: |
          if git ls-files | grep -E '(^|/)service-account.*\.json$|\.p8$|firebase-adminsdk.*\.json$'; then
            echo "::error::Private Firebase/APNs credentials must not be committed"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android (debug)
        run: flutter build apk --debug
