name: API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate NestJS API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digital_bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_bank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STAGE: dev
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: digital_bank_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      JWT_SECRET: ci-test-only-secret
      SEED_ON_START: "true"

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e
